[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-code"
version = "3.0.0.dev0"
description = "A checkpointed terminal coding assistant powered by Nexa"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
    "nexa-lang @ git+https://github.com/Nexa-Language/Nexa.git@274379606e53c90d2d25774f6bb8984c777d0759",
]

[project.optional-dependencies]
mcp = ["nexa-lang[mcp] @ git+https://github.com/Nexa-Language/Nexa.git@274379606e53c90d2d25774f6bb8984c777d0759"]
anthropic = ["nexa-lang[anthropic] @ git+https://github.com/Nexa-Language/Nexa.git@274379606e53c90d2d25774f6bb8984c777d0759"]

[project.scripts]
nexa-code-engine = "nexa_code.host:main"

[tool.uv.sources]
nexa-lang = { path = "../.runtime/nexa-3.0.0", editable = true }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-timeout>=2.3,<3",
    "pytest-socket>=0.7,<1",
    "ruff>=0.17,<0.18",
    "isort>=8,<10",
    "ty>=0.0.90,<0.1",
    "setuptools>=77",
]

[tool.setuptools.packages.find]
include = ["nexa_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket"
timeout = 40
markers = ["integration: explicit network/provider/desktop opt-in", "oci: explicit real Docker/OCI fixture test"]

[tool.ruff]
line-length = 160
target-version = "py310"
include = ["nexa_code/**/*.py", "tests/runtime/**/*.py", "tests/conftest.py", "scripts/**/*.py", "setup.py", "run_harness_bench.py", "ui/app.py"]

[tool.isort]
profile = "black"
line_length = 160
skip_glob = ["src/*", "ui/*", "tests/legacy/*"]

[tool.ty.src]
include = ["nexa_code", "tests/runtime", "scripts", "setup.py", "run_harness_bench.py", "ui/app.py"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["../.runtime/nexa-3.0.0"]
